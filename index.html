<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RTE 2009 Rules Book</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f5f7fb;
        color: #172033;
    }

    header {
        background: #182848;
        color: white;
        padding: 28px 20px;
    }

    .header-inner {
        max-width: 1100px;
        margin: auto;
    }

    h1 {
        margin: 0 0 8px;
        font-size: 30px;
    }

    .subtitle {
        margin: 0;
        opacity: 0.85;
        font-size: 15px;
    }

    .container {
        max-width: 1100px;
        margin: 25px auto;
        padding: 0 16px;
    }

    .search-box {
        background: white;
        padding: 18px;
        border-radius: 12px;
        box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        margin-bottom: 20px;
    }

    #searchInput {
        width: 100%;
        padding: 15px 17px;
        font-size: 16px;
        border: 1px solid #ccd3df;
        border-radius: 9px;
        outline: none;
    }

    #searchInput:focus {
        border-color: #3857d6;
    }

    .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
    }

    .filter-btn {
        border: 1px solid #ccd3df;
        background: white;
        padding: 8px 13px;
        border-radius: 20px;
        cursor: pointer;
        font-size: 13px;
    }

    .filter-btn.active {
        background: #182848;
        color: white;
        border-color: #182848;
    }

    .result-info {
        margin: 15px 2px;
        color: #657083;
        font-size: 14px;
    }

    .rule-card {
        background: white;
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 14px;
        box-shadow: 0 2px 9px rgba(0,0,0,0.07);
        border-left: 4px solid #3857d6;
    }

    .category {
        display: inline-block;
        background: #eef1ff;
        color: #3046aa;
        padding: 5px 9px;
        border-radius: 5px;
        font-size: 12px;
        font-weight: bold;
        margin-bottom: 10px;
    }

    .rule-card h2 {
        margin: 3px 0 9px;
        font-size: 20px;
    }

    .rule-card p {
        line-height: 1.6;
        margin: 7px 0;
        color: #424b5a;
    }

    .source {
        margin-top: 14px;
        padding-top: 13px;
        border-top: 1px solid #edf0f5;
        font-size: 13px;
        color: #667085;
    }

    .source strong {
        color: #273043;
    }

    .source-btn {
        display: inline-block;
        margin-top: 12px;
        padding: 9px 14px;
        background: #182848;
        color: white;
        text-decoration: none;
        border-radius: 7px;
        font-size: 13px;
        font-weight: bold;
    }

    .source-btn:hover {
        background: #2b4275;
    }

    .no-results {
        background: white;
        padding: 35px;
        text-align: center;
        border-radius: 12px;
        color: #687386;
    }

    footer {
        text-align: center;
        padding: 30px 15px;
        color: #7b8494;
        font-size: 13px;
    }

    @media (max-width: 600px) {
        h1 {
            font-size: 24px;
        }

        .rule-card {
            padding: 16px;
        }

        .rule-card h2 {
            font-size: 18px;
        }
    }
</style>
</head>

<body>

<header>
    <div class="header-inner">
        <h1>RTE 2009 Rules Book</h1>
        <p class="subtitle">
            Searchable, source-linked reference to the supplied RTE Act, Rules,
            Guidelines and Notifications
        </p>
    </div>
</header>

<div class="container">

    <div class="search-box">

        <input
            type="search"
            id="searchInput"
            placeholder="Search rules, sections, admission, age proof, 25%, screening..."
            autocomplete="off"
        >

        <div class="filters" id="filters"></div>

    </div>

    <div class="result-info" id="resultInfo"></div>

    <div id="results"></div>

</div>

<footer>
    RTE Rules Book • Source-linked reference
</footer>


<script>

    {

        summary:

/* =========================================================
   UI
   ========================================================= */

const searchInput = document.getElementById("searchInput");
const resultsDiv = document.getElementById("results");
const resultInfo = document.getElementById("resultInfo");
const filtersDiv = document.getElementById("filters");

let activeCategory = "All";


/* =========================================================
   CREATE FILTERS
   ========================================================= */

const categories = [
    "All",
    ...new Set(rules.map(rule => rule.category))
];

categories.forEach(category => {

    const button = document.createElement("button");

    button.className =
        "filter-btn" + (category === "All" ? " active" : "");

    button.textContent = category;

    button.addEventListener("click", () => {

        activeCategory = category;

        document
            .querySelectorAll(".filter-btn")
            .forEach(btn => btn.classList.remove("active"));

        button.classList.add("active");

        renderResults();

    });

    filtersDiv.appendChild(button);

});


/* =========================================================
   SEARCH
   ========================================================= */

searchInput.addEventListener("input", renderResults);


/* =========================================================
   RENDER RESULTS
   ========================================================= */

function renderResults() {

    const query =
        searchInput.value
            .trim()
            .toLowerCase();

    const filtered = rules.filter(rule => {

        const categoryMatch =
            activeCategory === "All" ||
            rule.category === activeCategory;

        const searchableText = [
            rule.title,
            rule.section,
            rule.category,
            rule.keywords,
            rule.summary
        ]
        .join(" ")
        .toLowerCase();

        const searchMatch =
            query === "" ||
            searchableText.includes(query);

        return categoryMatch && searchMatch;

    });


    resultInfo.textContent =
        `${filtered.length} rule${filtered.length !== 1 ? "s" : ""} found`;


    if (filtered.length === 0) {

        resultsDiv.innerHTML = `
            <div class="no-results">
                <h3>No matching rule found</h3>
                <p>Try another keyword, section number or topic.</p>
            </div>
        `;

        return;
    }


    resultsDiv.innerHTML =
        filtered.map(createRuleCard).join("");

}


/* =========================================================
   CREATE RULE CARD
   ========================================================= */

function createRuleCard(rule) {

    const pdfUrl =
        PDF_BASE +
        encodeURIComponent(rule.pdf) +
        `#page=${rule.page}`;

    return `
        <article class="rule-card">

            <span class="category">
                ${escapeHTML(rule.category)}
            </span>

            <h2>
                ${escapeHTML(rule.title)}
            </h2>

            <p>
                <strong>${escapeHTML(rule.section)}</strong>
            </p>

            <p>
                ${escapeHTML(rule.summary)}
            </p>

            <div class="source">

                <div>
                    <strong>Source:</strong>
                    ${escapeHTML(rule.pdf)}
                </div>

                <div>
                    <strong>PDF Page:</strong>
                    ${rule.page}
                </div>

                <a
                    class="source-btn"
                    href="${pdfUrl}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    📄 View Source Page
                </a>

            </div>

        </article>
    `;
}


/* =========================================================
   BASIC HTML ESCAPE
   ========================================================= */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   INITIAL LOAD
   ========================================================= */

renderResults();

</script>

</body>
</html>
