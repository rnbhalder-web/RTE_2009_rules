<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RTE 2009 Rules Book</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    header {
      background: #111827;
      color: white;
      padding: 28px 20px;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .subtitle {
      margin: 0;
      color: #d1d5db;
      font-size: 14px;
    }

    .container {
      max-width: 1100px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .search-box {
      background: white;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      margin-bottom: 18px;
    }

    #searchInput {
      width: 100%;
      padding: 13px 15px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    #searchInput:focus {
      border-color: #2563eb;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .filter-btn {
      border: 1px solid #d1d5db;
      background: white;
      padding: 7px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
    }

    .filter-btn:hover {
      background: #f3f4f6;
    }

    .filter-btn.active {
      background: #2563eb;
      color: white;
      border-color: #2563eb;
    }

    .result-info {
      margin: 15px 0;
      color: #6b7280;
      font-size: 14px;
    }

    .rules {
      display: grid;
      gap: 16px;
    }

    .rule-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .rule-id {
      display: inline-block;
      background: #eef2ff;
      color: #3730a3;
      padding: 4px 8px;
      border-radius: 5px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .rule-title {
      margin: 0 0 10px;
      font-size: 19px;
      line-height: 1.4;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 12px;
    }

    .meta span {
      background: #f3f4f6;
      color: #4b5563;
      padding: 5px 8px;
      border-radius: 5px;
      font-size: 12px;
    }

    .summary {
      line-height: 1.6;
      font-size: 14px;
      color: #374151;
    }

    .keywords {
      margin-top: 12px;
      font-size: 12px;
      color: #6b7280;
    }

    .sources {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid #e5e7eb;
    }

    .source-title {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #374151;
    }

    .source-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      text-decoration: none;
      padding: 9px 11px;
      margin-top: 7px;
      border-radius: 7px;
      background: #f8fafc;
      color: #2563eb;
      font-size: 13px;
    }

    .source-link:hover {
      background: #eef2ff;
    }

    .source-link span {
      color: #6b7280;
      font-size: 12px;
      white-space: nowrap;
    }

    .no-results {
      background: white;
      padding: 30px;
      text-align: center;
      border-radius: 12px;
      color: #6b7280;
    }

    footer {
      text-align: center;
      color: #9ca3af;
      font-size: 12px;
      padding: 30px 15px;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 23px;
      }

      .rule-card {
        padding: 16px;
      }

      .rule-title {
        font-size: 17px;
      }

      .source-link {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <h1>RTE 2009 Rules Book</h1>
    <p class="subtitle">
      Searchable reference of Right to Education rules, guidelines and amendments
    </p>
  </div>
</header>

<div class="container">

  <div class="search-box">

    <input
      type="text"
      id="searchInput"
      placeholder="Search rules, sections, keywords..."
      autocomplete="off"
    >

    <div class="filters" id="filters"></div>

  </div>

  <div class="result-info" id="resultInfo"></div>

  <div class="rules" id="rulesContainer"></div>

</div>

<footer>
  RTE Rules Reference Book
</footer>

<script src="rules.js"></script>

<script>

  let currentCategory = "All";

  const searchInput = document.getElementById("searchInput");
  const filtersContainer = document.getElementById("filters");
  const rulesContainer = document.getElementById("rulesContainer");
  const resultInfo = document.getElementById("resultInfo");


  /*
   * Escape HTML characters.
   * This prevents rule text from accidentally being interpreted as HTML.
   */
  function escapeHTML(value) {
    if (value === null || value === undefined) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  /*
   * Create category filter buttons.
   */
  function renderFilters() {

    const categories = getCategories();

    filtersContainer.innerHTML = "";

    const allButton = document.createElement("button");

    allButton.className =
      "filter-btn " + (currentCategory === "All" ? "active" : "");

    allButton.textContent = "All";

    allButton.onclick = function() {
      currentCategory = "All";
      renderFilters();
      renderRules();
    };

    filtersContainer.appendChild(allButton);


    categories.forEach(function(category) {

      const button = document.createElement("button");

      button.className =
        "filter-btn " +
        (currentCategory === category ? "active" : "");

      button.textContent = category;

      button.onclick = function() {
        currentCategory = category;
        renderFilters();
        renderRules();
      };

      filtersContainer.appendChild(button);

    });

  }


  /*
   * Search + category filtering.
   */
  function getFilteredRules() {

    const query = searchInput.value.trim();

    let rules = RTE_RULES.slice();


    if (currentCategory !== "All") {

      rules = rules.filter(function(rule) {
        return rule.category === currentCategory;
      });

    }


    if (!query) {
      return rules;
    }


    const q = query.toLowerCase();


    return rules.filter(function(rule) {

      const searchableText = [

        rule.id,

        rule.title,

        rule.category,

        rule.section,

        rule.summary,

        ...(rule.keywords || []),

        ...(rule.sourcePages || []).map(function(source) {
          return source.label;
        }),

        ...(rule.sourcePages || []).map(function(source) {
          return source.file;
        })

      ]
      .join(" ")
      .toLowerCase();


      return searchableText.includes(q);

    });

  }


  /*
   * Create source links for ALL supporting PDFs.
   */
  function createSourceLinks(rule) {

    const sourcePages = rule.sourcePages || [];

    if (sourcePages.length === 0) {

      return `
        <div class="sources">
          <div class="source-title">Source Documents</div>
          <div style="font-size:13px;color:#6b7280;">
            No source document linked.
          </div>
        </div>
      `;

    }


    const links = sourcePages.map(function(source) {

      const fileName = encodeURIComponent(source.file);

      const pageNumber = Number(source.page) || 1;

      const url =
        "pdf/" +
        fileName +
        "#page=" +
        pageNumber;


      return `
        <a
          href="${url}"
          target="_blank"
          rel="noopener noreferrer"
          class="source-link"
        >
          <span style="color:#2563eb;">
            📄 ${escapeHTML(source.label)}
          </span>

          <span>
            Page ${pageNumber} ↗
          </span>
        </a>
      `;

    }).join("");


    return `
      <div class="sources">

        <div class="source-title">
          Source Documents
        </div>

        ${links}

      </div>
    `;

  }


  /*
   * Render rule cards.
   */
  function renderRules() {

    const rules = getFilteredRules();


    resultInfo.textContent =
      rules.length +
      (rules.length === 1 ? " rule found" : " rules found");


    if (rules.length === 0) {

      rulesContainer.innerHTML = `
        <div class="no-results">
          No matching rule found.
        </div>
      `;

      return;
    }


    rulesContainer.innerHTML = rules.map(function(rule) {

      const keywords = (rule.keywords || [])
        .map(function(keyword) {
          return escapeHTML(keyword);
        })
        .join(", ");


      return `

        <article class="rule-card">

          <div class="rule-id">
            ${escapeHTML(rule.id)}
          </div>


          <h2 class="rule-title">
            ${escapeHTML(rule.title)}
          </h2>


          <div class="meta">

            ${
              rule.category
                ? `<span>Category: ${escapeHTML(rule.category)}</span>`
                : ""
            }

            ${
              rule.section
                ? `<span>Section: ${escapeHTML(rule.section)}</span>`
                : ""
            }

          </div>


          <div class="summary">
            ${escapeHTML(rule.summary)}
          </div>


          ${
            keywords
              ? `
                <div class="keywords">
                  <strong>Keywords:</strong>
                  ${keywords}
                </div>
              `
              : ""
          }


          ${createSourceLinks(rule)}

        </article>

      `;

    }).join("");

  }


  /*
   * Search while typing.
   */
  searchInput.addEventListener("input", function() {
    renderRules();
  });


  /*
   * Initial page load.
   */
  renderFilters();
  renderRules();

</script>

</body>
</html>
